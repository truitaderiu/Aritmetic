<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradient monocromàtic en tons grisos elegants -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Ombra suau per donar relleu als traços -->
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#09090b" flood-opacity="0.32" />
    </filter>

    <!-- Gradient gris clar / blanc trencat per a les barres de l'igual -->
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Brillantor subtil superior -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Fons quadrat arrodonit monocromàtic -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#bgGradient)" />

  <!-- Capa de brillantor subtil -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#sheen)" />

  <!-- Vora subtil interior en gris clar -->
  <rect x="1" y="1" width="118" height="118" rx="25" stroke="#d4d4d8" stroke-width="1.5" stroke-opacity="0.28" fill="none" />

  <!-- Símbol IGUAL (=) format per dues barres arrodonides -->
  <rect x="28" y="42" width="64" height="13" rx="6.5" fill="url(#barGradient)" filter="url(#softShadow)" />
  <rect x="28" y="65" width="64" height="13" rx="6.5" fill="url(#barGradient)" filter="url(#softShadow)" />
</svg>
