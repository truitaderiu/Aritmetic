<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradient de fons modern blau intens a indi -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Ombra suau per donar relleu als traços -->
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <!-- Gradient per a les barres de l'igual -->
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Brillantor subtil superior tipus vidre / app icon -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Fons quadrat arrodonit (estil icona d'app moderna) -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#bgGradient)" />

  <!-- Capa de brillantor subtil -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#sheen)" />

  <!-- Vora subtil interior -->
  <rect x="1" y="1" width="118" height="118" rx="25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Símbol IGUAL (=) format per dues barres elegants arrodonides -->
  <!-- Barra superior -->
  <rect x="28" y="42" width="64" height="13" rx="6.5" fill="url(#barGradient)" filter="url(#softShadow)" />

  <!-- Barra inferior -->
  <rect x="28" y="65" width="64" height="13" rx="6.5" fill="url(#barGradient)" filter="url(#softShadow)" />
</svg>
